name: Stage 4 Full Lint Diagnostic

on:
  push:
    branches: [codex/stage4-hardening]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[full-lint-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/stage4-hardening
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Capture full lint output
        run: |
          bun run lint > stage4-lint-diagnostics-full.txt 2>&1 || true
          rm .github/workflows/stage4-lint-full.yml
          git config user.name "seerati-stage4-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture full lint diagnostics [full-lint-diagnostic]"
          git push origin HEAD:codex/stage4-hardening
