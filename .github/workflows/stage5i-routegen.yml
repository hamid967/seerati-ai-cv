name: Stage5I Route Tree

on:
  push:
    branches:
      - stage5i/recruiter-10s-scan

permissions:
  contents: write

jobs:
  routegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage5i/recruiter-10s-scan
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fix route and generate router types
        run: |
          node scripts/fix-stage5i-route-types.mjs
          bunx prettier --write 'src/routes/resumes.$id.recruiter-scan.tsx'
          bun run build
          rm scripts/fix-stage5i-route-types.mjs
      - name: Commit generated route tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts 'src/routes/resumes.$id.recruiter-scan.tsx' scripts/fix-stage5i-route-types.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: register Stage 5I recruiter scan route"
          git push origin HEAD:stage5i/recruiter-10s-scan
