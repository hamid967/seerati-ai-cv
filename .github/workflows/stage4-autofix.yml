name: Stage 4 One-Time Autofix

on:
  push:
    branches: [codex/stage4-hardening]

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[stage4-autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stage4-hardening

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Normalize formatting
        run: bun run format

      - name: Commit formatting and remove this one-time workflow
        run: |
          rm .github/workflows/stage4-autofix.yml
          git config user.name "seerati-stage4-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: normalize formatting [stage4-autofix]"
          git push origin HEAD:codex/stage4-hardening

      - name: Lint
        continue-on-error: true
        run: bun run lint

      - name: Type check
        continue-on-error: true
        run: bunx tsc --noEmit

      - name: Build
        continue-on-error: true
        run: bun run build

      - name: QA AI routes
        continue-on-error: true
        run: bun run qa:ai

      - name: QA AppShell routes
        continue-on-error: true
        run: bun run check:routes-shell

      - name: QA AI contracts
        continue-on-error: true
        run: bun run test:ai-contract

      - name: QA resume diffs
        continue-on-error: true
        run: bun run test:resume-diff

      - name: QA templates
        continue-on-error: true
        run: bun run test:templates

      - name: QA RTL
        continue-on-error: true
        run: bun run check:rtl
