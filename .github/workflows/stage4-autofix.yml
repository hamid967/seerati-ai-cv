name: Stage 4 One-Time Autofix

on:
  push:
    branches: [codex/stage4-hardening]

permissions:
  contents: write

jobs:
  autofix:
    if: ${{ !contains(github.event.head_commit.message, '[stage4-autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stage4-hardening

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Normalize formatting
        run: bun run format

      - name: Validate formatted code
        run: |
          bun run lint
          bunx tsc --noEmit
          bun run build
          bun run qa:ai
          bun run check:routes-shell
          bun run test:ai-contract
          bun run test:resume-diff
          bun run test:templates
          bun run check:rtl

      - name: Remove this one-time workflow and commit fixes
        run: |
          rm .github/workflows/stage4-autofix.yml
          git config user.name "seerati-stage4-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: normalize formatting and validate Stage 4 [stage4-autofix]"
          git push origin HEAD:codex/stage4-hardening
