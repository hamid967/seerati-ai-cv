name: Stage5E Route Tree

on:
  push:
    branches:
      - stage5e/resume-studio-ultra

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage5e/resume-studio-ultra
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate TanStack route tree
        run: |
          bun run build
          rm .github/workflows/stage5e-route-tree.yml
      - name: Commit generated route tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts .github/workflows/stage5e-route-tree.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: generate Stage 5E route tree"
          git push origin HEAD:stage5e/resume-studio-ultra
