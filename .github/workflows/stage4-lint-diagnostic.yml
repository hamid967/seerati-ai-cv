name: Stage 4 Lint Diagnostic

on:
  push:
    branches: [codex/stage4-hardening]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[lint-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/stage4-hardening
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Capture lint output
        run: |
          bunx eslint src/lib/ai-runtime.server.ts src/lib/ai.functions.ts > stage4-lint-diagnostics.txt 2>&1 || true
          rm .github/workflows/stage4-lint-diagnostic.yml
          git config user.name "seerati-stage4-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture lint diagnostics [lint-diagnostic]"
          git push origin HEAD:codex/stage4-hardening
