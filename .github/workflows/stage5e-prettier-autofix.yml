name: Stage5E Prettier Autofix

on:
  push:
    branches:
      - stage5e/resume-studio-ultra

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage5e/resume-studio-ultra
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format Stage 5E files
        run: |
          bunx prettier --write scripts/check-resume-studio-ultra.mjs src/lib/resume-studio.ts src/lib/types.ts 'src/routes/resumes.$id.studio.tsx'
          rm .github/workflows/stage5e-prettier-autofix.yml
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-resume-studio-ultra.mjs src/lib/resume-studio.ts src/lib/types.ts 'src/routes/resumes.$id.studio.tsx' .github/workflows/stage5e-prettier-autofix.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: format stage5e resume studio"
          git push origin HEAD:stage5e/resume-studio-ultra
