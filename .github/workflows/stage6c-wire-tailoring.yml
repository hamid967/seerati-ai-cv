name: Stage6C Wire Tailoring

on:
  push:
    branches:
      - stage6c/tailoring-studio

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage6c/tailoring-studio
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Wire Tailoring Studio
        run: |
          node scripts/patch-stage6c-tailoring.mjs
          bunx prettier --write 'src/routes/jobs.$id.tsx' src/components/tailoring-studio-panel.tsx src/lib/tailoring-studio.ts scripts/check-tailoring-studio.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/jobs.$id.tsx' src/components/tailoring-studio-panel.tsx src/lib/tailoring-studio.ts scripts/check-tailoring-studio.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire Tailoring Studio into Job Workspace"
          git push origin HEAD:stage6c/tailoring-studio
