name: Stage6DH Format

on:
  push:
    branches:
      - stage6d-h/market-leadership-completion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage6d-h/market-leadership-completion
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format Stage 6D-H files
        run: >-
          bunx prettier --write
          docs/SAUDI_LAUNCH_SCORECARD.md
          scripts/check-stage6d-h-market-leadership.mjs
          src/components/app/app-shell.tsx
          src/lib/arabic-career-intelligence.ts
          src/lib/career-passport.ts
          src/lib/product-analytics.ts
          src/router.tsx
          src/routes/arabic-intelligence.tsx
          src/routes/career-guides.tsx
          src/routes/career-passport.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SAUDI_LAUNCH_SCORECARD.md scripts/check-stage6d-h-market-leadership.mjs src/components/app/app-shell.tsx src/lib/arabic-career-intelligence.ts src/lib/career-passport.ts src/lib/product-analytics.ts src/router.tsx src/routes/arabic-intelligence.tsx src/routes/career-guides.tsx src/routes/career-passport.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style: format Stage 6D-H files"
          git push origin HEAD:stage6d-h/market-leadership-completion
