name: Stage6A Prettier

on:
  push:
    branches:
      - stage6/saudi-market-leadership

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage6/saudi-market-leadership
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format Stage 6A source files
        run: bunx prettier --write docs/SAUDI_MARKET_LEADERSHIP_100_TEAM.md src/components/saudi-career-readiness-panel.tsx src/lib/saudi-career-readiness.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SAUDI_MARKET_LEADERSHIP_100_TEAM.md src/components/saudi-career-readiness-panel.tsx src/lib/saudi-career-readiness.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format Stage 6A Saudi leadership files"
          git push origin HEAD:stage6/saudi-market-leadership
