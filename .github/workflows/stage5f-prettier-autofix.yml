name: Stage5F Prettier Autofix

on:
  push:
    branches:
      - stage5f/professional-layout-engine

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage5f/professional-layout-engine
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format Stage 5F files
        run: |
          bunx prettier --write src/lib/pdf.ts src/lib/resume-layout.ts src/routes/resumes.\$id.preview.tsx src/routes/resumes.\$id.studio.tsx
          rm .github/workflows/stage5f-prettier-autofix.yml
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pdf.ts src/lib/resume-layout.ts src/routes/resumes.\$id.preview.tsx src/routes/resumes.\$id.studio.tsx .github/workflows/stage5f-prettier-autofix.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: format stage5f professional layout engine"
          git push origin HEAD:stage5f/professional-layout-engine
