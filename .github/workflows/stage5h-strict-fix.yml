name: Stage5H Strict Optional Fix

on:
  push:
    branches:
      - stage5h/resume-design-intelligence

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage5h/resume-design-intelligence
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply strict optional fix
        run: |
          node scripts/stage5h-strict-optional-fix.mjs
          bunx prettier --write 'src/routes/resumes.$id.studio.tsx' src/lib/resume-design-intelligence.ts
          rm scripts/stage5h-strict-optional-fix.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/resumes.$id.studio.tsx' src/lib/resume-design-intelligence.ts scripts/stage5h-strict-optional-fix.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: satisfy strict optional design types in Stage 5H"
          git push origin HEAD:stage5h/resume-design-intelligence
