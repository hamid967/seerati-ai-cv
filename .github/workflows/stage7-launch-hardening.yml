name: Stage7 Launch Hardening

on:
  push:
    branches:
      - stage7/production-launch-readiness

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage7/production-launch-readiness
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply launch-readiness fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/index.tsx')
          s = p.read_text()
          marker = '  const ar = lang === "ar";\n'
          insert = '''  const ar = lang === "ar";\n  const templateCount = defaultTemplates.length;\n  const atsTemplateCount = defaultTemplates.filter((template) => template.atsFriendly).length;\n'''
          if marker not in s:
              raise SystemExit('landing marker missing')
          s = s.replace(marker, insert, 1)
          old_ar = '          a: "خمسة من القوالب الستة مبنية بعمود واحد وعناوين نصية واضحة، وهي الأنسب للتقديم الإلكتروني. القالب الإبداعي مخصص للتقديم المباشر أو ملف الأعمال.",'
          new_ar = '          a: `${atsTemplateCount} من أصل ${templateCount} قالباً مميزة داخل النظام كقوالب ATS محافظة وفق قواعد سيرتي. اختر القالب المناسب للوظيفة، والنتيجة تبقى إرشادية وليست ضماناً لقبول نظام جهة التوظيف.`,'
          old_en = '          a: "Five of the six templates use a single column with plain text headings, which suits online applications. The creative template is meant for direct sharing or a portfolio.",'
          new_en = '          a: `${atsTemplateCount} of ${templateCount} templates are marked as conservative ATS-oriented templates under Seerati rules. Choose the layout for the role; this remains guidance, not a guarantee of an employer system result.`,'
          if old_ar not in s or old_en not in s:
              raise SystemExit('stale FAQ markers missing')
          s = s.replace(old_ar, new_ar, 1).replace(old_en, new_en, 1)
          p.write_text(s)

          p = Path('src/routes/dashboard.tsx')
          s = p.read_text()
          s = s.replace('    createResume,\n', '', 1)
          demo = '''                  <Button\n                    variant="outline"\n                    onClick={() => {\n                      void (async () => {\n                        const created = await createResume({\n                          title: ar ? "سيرة تجريبية" : "Demo resume",\n                          templateId: "saudi-professional",\n                          language: "ar",\n                          seed: true,\n                        });\n                        if (created) toast.success(ar ? "أضفنا سيرة تجريبية" : "Demo resume added");\n                        else toast.error(t("limit_reached"));\n                      })();\n                    }}\n                  >\n                    {ar ? "جرّب ببيانات تجريبية" : "Try with demo data"}\n                  </Button>\n'''
          if demo not in s:
              raise SystemExit('dashboard demo block missing')
          s = s.replace(demo, '', 1)
          p.write_text(s)

          p = Path('src/routes/resumes.$id.preview.tsx')
          s = p.read_text()
          s = s.replace(
              '{ar ? "PDF نصي (طباعة)" : "Print / text PDF"}',
              '{ar ? "PDF نصي للتقديم وATS" : "Text PDF for applications / ATS"}',
              1,
          )
          s = s.replace(
              '{ar ? "تنزيل PDF عالي الدقة" : "Download high-res PDF"}',
              '{ar ? "PDF بصري (صورة)" : "Visual image PDF"}',
              1,
          )
          old_note = '''        {ar\n          ? `حجم الورق الفعلي: ${page.label} (${page.widthMm} × ${page.heightMm} مم). الطباعة وPDF عالي الدقة يستخدمان نفس إعدادات Studio المحفوظة.`\n          : `Actual paper size: ${page.label} (${page.widthMm} × ${page.heightMm} mm). Print and high-resolution PDF use the same saved Studio settings.`}'''
          new_note = '''        {ar\n          ? `حجم الورق الفعلي: ${page.label} (${page.widthMm} × ${page.heightMm} مم). استخدم PDF النصي أو النسخة النصية للتقديم الإلكتروني. PDF البصري مبني كصورة للمشاركة أو الأرشفة وقد لا يُقرأ جيداً في أنظمة الفرز.`\n          : `Actual paper size: ${page.label} (${page.widthMm} × ${page.heightMm} mm). Use the text PDF or plain-text copy for online applications. The visual PDF is image-based for sharing or archiving and may not parse reliably in screening systems.`}'''
          if old_note not in s:
              raise SystemExit('preview note marker missing')
          s = s.replace(old_note, new_note, 1)
          p.write_text(s)

          Path('public/robots.txt').write_text('''User-agent: *\nAllow: /\nDisallow: /auth\nDisallow: /dashboard\nDisallow: /admin\nDisallow: /account\nDisallow: /onboarding\nDisallow: /resumes\nDisallow: /career-twin\nDisallow: /career-evidence\nDisallow: /career-passport\nDisallow: /arabic-intelligence\nDisallow: /privacy-center\nDisallow: /import\nDisallow: /jobs\n\nSitemap: https://hrhbs.com/sitemap.xml\n''')

          p = Path('scripts/qa-routes.mjs')
          s = p.read_text()
          old = '''  "/career-evidence",\n  "/import",\n  "/jobs",'''
          new = '''  "/career-evidence",\n  "/career-passport",\n  "/arabic-intelligence",\n  "/privacy-center",\n  "/career-guides",\n  "/features",\n  "/import",\n  "/jobs",'''
          if old not in s:
              raise SystemExit('route QA marker missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          s = s.replace('        "stage6d-h/**",\n', '        "stage6d-h/**",\n        "stage7/**",\n', 1)
          marker = '          node scripts/check-stage6d-h-market-leadership.mjs\n'
          if marker not in s:
              raise SystemExit('CI static QA marker missing')
          s = s.replace(marker, marker + '          node scripts/check-production-launch-readiness.mjs\n', 1)
          p.write_text(s)
          PY
      - name: Format touched files
        run: |
          bunx prettier --write \
            src/routes/index.tsx \
            src/routes/dashboard.tsx \
            'src/routes/resumes.$id.preview.tsx' \
            scripts/qa-routes.mjs \
            scripts/check-production-launch-readiness.mjs \
            .github/workflows/ci.yml
      - name: Run launch static guard
        run: node scripts/check-production-launch-readiness.mjs
      - name: Commit hardening and remove workflow
        run: |
          rm .github/workflows/stage7-launch-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml public/robots.txt scripts/qa-routes.mjs scripts/check-production-launch-readiness.mjs src/routes/index.tsx src/routes/dashboard.tsx 'src/routes/resumes.$id.preview.tsx' .github/workflows/stage7-launch-hardening.yml
          git commit -m "Stage 7: harden production launch readiness"
          git push origin HEAD:stage7/production-launch-readiness
