name: Stage 11 Wire Controls
on:
  push:
    branches:
      - stage11/flowcv-editor-controls
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage11/flowcv-editor-controls
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Wire controls
        run: |
          cat > /tmp/stage11.py <<'PY'
          from pathlib import Path

          p = Path("src/lib/types.ts")
          s = p.read_text()
          old = '  density?: "compact" | "normal" | "airy";\n  showPhoto?: boolean;'
          new = '  density?: "compact" | "normal" | "airy";\n  /** Optional user layout override; content remains unchanged. */\n  layout?: TemplateDesign["layout"];\n  showPhoto?: boolean;'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/components/resume-preview.tsx")
          s = p.read_text()
          old = '    accent: user.accent || tpl.design.accent,\n    spacing: user.density || tpl.design.spacing,\n  };'
          new = '    accent: user.accent || tpl.design.accent,\n    spacing: user.density || tpl.design.spacing,\n    layout: user.layout || tpl.design.layout,\n  };'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("src/components/professional-resume-preview.tsx")
          s = p.read_text()
          old = '  const template = getTemplate(resume.templateId);\n  const hidden = new Set(resume.data.hiddenSections ?? []);'
          new = '  const template = getTemplate(resume.templateId);\n  const layout = resume.data.design?.layout ?? template.design.layout;\n  const hidden = new Set(resume.data.hiddenSections ?? []);'
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('  if (template.design.layout === "single") return visible;', '  if (layout === "single") return visible;', 1)
          s = s.replace('  return template.design.layout === "sidebar-left" ? [...aside, ...main] : [...main, ...aside];', '  return layout === "sidebar-left" ? [...aside, ...main] : [...main, ...aside];', 1)
          p.write_text(s)

          p = Path("src/routes/resumes.$id.edit.tsx")
          s = p.read_text()
          old = 'import { ResumePreview, getTemplate } from "@/components/resume-preview";'
          new = '''import { getTemplate } from "@/components/resume-preview";
          import { ProfessionalResumePreview } from "@/components/professional-resume-preview";
          import {
            ResumeEditorLayoutControls,
            ResumeSectionVisibilityControls,
          } from "@/components/resume-editor-layout-controls";'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '                {tpl?.design.supportsPhoto ? ('
          insert = '''                {tpl ? (
                  <ResumeEditorLayoutControls
                    ar={ar}
                    design={d.design}
                    template={tpl}
                    onChange={(designPatch) =>
                      setData((data) => {
                        data.design = { ...data.design, ...designPatch };
                      })
                    }
                  />
                ) : null}

'''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)

          order_marker = '''                <SortableList
                  ids={d.sectionOrder}'''
          visibility = '''                <ResumeSectionVisibilityControls
                  ar={ar}
                  sections={d.sectionOrder.map((key) => ({
                    key,
                    label: sectionLabels[key][lang],
                  }))}
                  hiddenSections={d.hiddenSections ?? []}
                  onChange={(hiddenSections) =>
                    setData((data) => {
                      data.hiddenSections = hiddenSections;
                    })
                  }
                />

'''
          assert order_marker in s
          s = s.replace(order_marker, visibility + order_marker, 1)
          s = s.replace('<ResumePreview resume={draft} />', '<ProfessionalResumePreview resume={draft} />')
          p.write_text(s)
          PY
          python3 /tmp/stage11.py
      - name: Format
        run: bunx prettier --write src/lib/types.ts src/components/resume-preview.tsx src/components/professional-resume-preview.tsx src/components/resume-editor-layout-controls.tsx 'src/routes/resumes.$id.edit.tsx'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/types.ts src/components/resume-preview.tsx src/components/professional-resume-preview.tsx src/components/resume-editor-layout-controls.tsx 'src/routes/resumes.$id.edit.tsx'
          git commit -m "Stage 11 — wire precision editor controls"
          git push origin HEAD:stage11/flowcv-editor-controls
