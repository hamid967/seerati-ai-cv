name: Format Synced Guest Store
on:
  push:
    branches:
      - hotfix/runtime-supabase-bootstrap-v2
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/runtime-supabase-bootstrap-v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/lib/store.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format synced guest store"
          git push origin HEAD:hotfix/runtime-supabase-bootstrap-v2
