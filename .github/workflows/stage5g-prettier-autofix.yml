name: Stage5G Prettier Autofix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage5g/smart-pagination-page-composer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format Stage 5G source files
        run: |
          bunx prettier --write scripts/check-smart-pagination-composer.mjs src/lib/resume-pagination.ts 'src/routes/resumes.$id.composer.tsx'
      - name: Commit formatted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-smart-pagination-composer.mjs src/lib/resume-pagination.ts 'src/routes/resumes.$id.composer.tsx'
          git diff --cached --quiet && exit 0
          git commit -m "style: format stage5g smart pagination source"
          git push origin HEAD:stage5g/smart-pagination-page-composer
