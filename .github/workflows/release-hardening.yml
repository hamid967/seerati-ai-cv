name: Release Hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ci-supabase.invalid
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_bundle_guard
  SUPABASE_URL: https://ci-supabase.invalid
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_bundle_guard
  BASE_URL: http://127.0.0.1:4173

jobs:
  browser-hardening:
    name: Browser hardening (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production artifact
        run: bun run build
      - name: Install browser and OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Start production preview
        run: |
          bunx wrangler dev --config .output/server/wrangler.json --port 4173 > /tmp/seerati-release-hardening.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS "$BASE_URL/assistant" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/seerati-release-hardening.log
          exit 1
      - name: Run E2E, Network Privacy, axe, keyboard, PDF and print checks
        env:
          BROWSER_ONLY: ${{ matrix.browser }}
        run: bun run test:release-hardening
      - name: Run Phase 14 guest parity and privacy smoke
        if: matrix.browser == 'chromium'
        run: bun run test:phase14-guest
      - name: Run Guest-First visitor flow smoke
        if: matrix.browser == 'chromium'
        run: bun run test:guest-first-browser
      - name: Run complete guest visitor workflow parity smoke
        if: matrix.browser == 'chromium'
        run: bun run test:guest-visitor-parity
      - name: Run intelligent template guide smoke
        if: matrix.browser == 'chromium'
        run: bun run test:template-intelligence
      - name: Run synthetic specialty resume privacy and export-safety smoke
        if: matrix.browser == 'chromium'
        run: bun run test:synthetic-resume-browser
      - name: Run consented guest recovery privacy smoke
        if: matrix.browser == 'chromium'
        run: bun run test:guest-recovery-browser
      - name: Upload hardening artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-hardening-${{ matrix.browser }}
          path: |
            artifacts/release-hardening/
            tests/release-baselines/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse public routes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: browser-hardening
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium and OS dependencies
        run: bunx playwright install --with-deps chromium
      - name: Build production artifact
        run: bun run build
      - name: Start production preview
        run: |
          bunx wrangler dev --config .output/server/wrangler.json --port 4173 > /tmp/seerati-lighthouse.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS "$BASE_URL/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/seerati-lighthouse.log
          exit 1
      - name: Run Lighthouse CI
        run: bun run test:lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: artifacts/lighthouse/
          if-no-files-found: ignore
