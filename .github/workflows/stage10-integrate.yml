name: Stage10 Integrate

on:
  push:
    branches:
      - stage10/premium-landing-intro

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage10/premium-landing-intro
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch landing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          imp = 'import { TEAM } from "@/lib/team";\n'
          if 'LandingIntro' not in s:
              s = s.replace(imp, imp + 'import { LandingCareerVisual, LandingIntro } from "@/components/landing-experience";\n')
          root = '    <div className="flex min-h-screen flex-col bg-background">\n      <SiteHeader />'
          s = s.replace(root, '    <div className="flex min-h-screen flex-col bg-background">\n      <LandingIntro ar={ar} />\n      <SiteHeader />')
          anchor = '          </div>\n        </section>\n\n        {/* The team */}'
          s = s.replace(anchor, '          </div>\n          <LandingCareerVisual ar={ar} />\n        </section>\n\n        {/* The team */}', 1)
          p.write_text(s)
          PY
      - name: Format Stage 10 files
        run: bunx prettier --write 'src/routes/index.tsx' 'src/components/landing-experience.tsx' 'src/landing-experience.css'
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/components/landing-experience.tsx src/landing-experience.css
          git diff --cached --quiet && exit 0
          git commit -m "Stage 10 — premium landing and cinematic intro"
          git push origin HEAD:stage10/premium-landing-intro
