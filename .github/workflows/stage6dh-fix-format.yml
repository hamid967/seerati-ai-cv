name: Stage6DH Fix Format

on:
  push:
    branches:
      - stage6d-h/market-leadership-completion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage6d-h/market-leadership-completion
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/lib/arabic-career-intelligence.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/arabic-career-intelligence.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format Arabic intelligence lint fix"
          git push origin HEAD:stage6d-h/market-leadership-completion
