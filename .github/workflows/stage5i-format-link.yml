name: Stage5I Format And Studio Link

on:
  push:
    branches:
      - stage5i/recruiter-10s-scan

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage5i/recruiter-10s-scan
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Integrate and format
        run: |
          node scripts/apply-stage5i-studio-link.mjs
          bunx prettier --write src/components/recruiter-ten-second-panel.tsx src/lib/recruiter-ten-second-scan.ts 'src/routes/resumes.$id.recruiter-scan.tsx' 'src/routes/resumes.$id.studio.tsx' scripts/check-recruiter-ten-second-scan.mjs
          rm scripts/apply-stage5i-studio-link.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/recruiter-ten-second-panel.tsx src/lib/recruiter-ten-second-scan.ts 'src/routes/resumes.$id.recruiter-scan.tsx' 'src/routes/resumes.$id.studio.tsx' scripts/check-recruiter-ten-second-scan.mjs scripts/apply-stage5i-studio-link.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate Stage 5I recruiter scan into Studio"
          git push origin HEAD:stage5i/recruiter-10s-scan
