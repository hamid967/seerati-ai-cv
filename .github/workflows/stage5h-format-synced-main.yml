name: Stage5H Format Synced Main

on:
  push:
    branches:
      - stage5h/resume-design-intelligence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage5h/resume-design-intelligence
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format synchronized files
        run: bunx prettier --write src/integrations/supabase/types.ts src/lib/db.ts vite.config.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts src/lib/db.ts vite.config.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format synchronized Lovable changes"
          git push origin HEAD:stage5h/resume-design-intelligence
