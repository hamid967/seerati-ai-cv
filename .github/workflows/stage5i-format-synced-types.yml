name: Stage5I Format Synced Types

on:
  push:
    branches:
      - stage5i/recruiter-10s-scan

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage5i/recruiter-10s-scan
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format synchronized Supabase types
        run: bunx prettier --write src/integrations/supabase/types.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format synchronized Supabase types"
          git push origin HEAD:stage5i/recruiter-10s-scan
