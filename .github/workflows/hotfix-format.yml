name: Hotfix Format

on:
  push:
    branches:
      - hotfix/production-hydration-supabase-env

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/production-hydration-supabase-env
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write scripts/check-production-env-bundle.mjs src/integrations/supabase/types.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-production-env-bundle.mjs src/integrations/supabase/types.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format production hydration hotfix"
          git push origin HEAD:hotfix/production-hydration-supabase-env
