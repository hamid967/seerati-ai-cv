name: Stage8 Format

on:
  push:
    branches:
      - stage8/release-operations-control

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage8/release-operations-control
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write scripts/check-release-operations.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-release-operations.mjs
          git diff --cached --quiet && exit 0
          git commit -m "style: format Stage 8 release guard"
          git push origin HEAD:stage8/release-operations-control
